# FIX: raise the memory limit above what the worker actually uses (~250 MiB).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-worker
  namespace: shop
  labels: {app: report-worker}
spec:
  replicas: 1
  selector:
    matchLabels: {app: report-worker}
  template:
    metadata:
      labels: {app: report-worker}
    spec:
      containers:
        - name: worker
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "1"]
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 200m, memory: 320Mi}
