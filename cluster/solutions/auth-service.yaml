# FIX: create the missing ConfigMap that auth-service loads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: shop
data:
  TOKEN_TTL_SECONDS: "3600"
  JWT_ISSUER: "shop-auth"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: shop
  labels: {app: auth-service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: auth-service}
  template:
    metadata:
      labels: {app: auth-service}
    spec:
      containers:
        - name: auth
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          envFrom:
            - configMapRef:
                name: auth-config
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
