# HEALTHY baseline: shows the agent can tell healthy pods from broken ones.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: shop
  labels: {app: web-frontend}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web-frontend}
  template:
    metadata:
      labels: {app: web-frontend}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: shop
spec:
  selector: {app: web-frontend}
  ports: [{port: 80, targetPort: 80}]
