# BROKEN #4 - CreateContainerConfigError
# The Deployment loads its settings from a ConfigMap called
# "auth-config", but that ConfigMap was never created.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: shop
  labels: {app: auth-service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: auth-service}
  template:
    metadata:
      labels: {app: auth-service}
    spec:
      containers:
        - name: auth
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          envFrom:
            - configMapRef:
                name: auth-config
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
