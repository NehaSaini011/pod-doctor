# BROKEN #3 - OOMKilled
# The worker needs ~250 MiB of memory but its limit is 100 MiB,
# so the kernel kills it (exit code 137) and it restarts forever.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-worker
  namespace: shop
  labels: {app: report-worker}
spec:
  replicas: 1
  selector:
    matchLabels: {app: report-worker}
  template:
    metadata:
      labels: {app: report-worker}
    spec:
      containers:
        - name: worker
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "1"]
          resources:
            requests: {cpu: 50m, memory: 50Mi}
            limits: {cpu: 200m, memory: 100Mi}
